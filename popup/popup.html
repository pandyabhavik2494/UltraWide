<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UltraWide</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="glyph" src="../icons/toolbar-on-32.png" alt="" width="18" height="18">
    <h1>UltraWide</h1>
    <label class="switch" title="Toggle UltraWide (⌥⇧U)">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>
  <section id="options">
    <div class="row">
      <span class="label">Mode</span>
      <div class="segmented" role="radiogroup">
        <label><input type="radio" name="mode" value="fill"><span>Fill</span></label>
        <label><input type="radio" name="mode" value="stretch"><span>Stretch</span></label>
      </div>
    </div>
    <p class="hint" id="mode-hint"></p>
    <div class="row">
      <label class="label" for="zoom">Extra zoom</label>
      <output id="zoom-value">100%</output>
    </div>
    <input type="range" id="zoom" min="100" max="150" step="1" value="100">
    <p class="hint">Raise this for movies with black bars baked into the video.</p>
  </section>
  <footer>Shortcut: <kbd>⌥</kbd><kbd>⇧</kbd><kbd>U</kbd></footer>
  <script src="popup.js"></script>
</body>
</html>
